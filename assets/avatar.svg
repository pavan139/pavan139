<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
<title id="title">Illustrated avatar for Pavan</title>
<desc id="desc">Original flat vector illustration of a dark-haired engineer wearing a navy sweater, surrounded by teal accents. This is a stylized illustration, not a portrait likeness.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B182A"/><stop offset="1" stop-color="#143849"/></linearGradient>
<linearGradient id="coat" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#263B5B"/><stop offset="1" stop-color="#0C172C"/></linearGradient>
<clipPath id="frame"><circle cx="250" cy="250" r="240"/></clipPath>
</defs>
<style>
@keyframes subtleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes eyeBlink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes mote{0%,100%{opacity:.45}50%{opacity:1}}
#figure{animation:subtleFloat 5s ease-in-out infinite;transform-origin:center center}
.eye{animation:eyeBlink 5.5s infinite;transform-origin:center}
.mote{animation:mote 3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){#figure,.eye,.mote{animation:none}}
</style>
<circle cx="250" cy="250" r="246" fill="#6CF0C2"/>
<circle cx="250" cy="250" r="240" fill="url(#bg)"/>
<g clip-path="url(#frame)">
<g fill="none" stroke="#5CAAB0" opacity=".16" stroke-width="2"><path d="M0 95H500M0 160H500M0 225H500M0 290H500M0 355H500M0 420H500"/><path d="M90 0V500M160 0V500M230 0V500M300 0V500M370 0V500M440 0V500"/></g>
<circle cx="250" cy="218" r="155" fill="#76E6C5" opacity=".09"/>
<circle cx="250" cy="218" r="132" fill="none" stroke="#6CF0C2" stroke-opacity=".48" stroke-width="3" stroke-dasharray="9 14"/>
<g id="figure">
<path d="M50 515 Q62 378 169 347 L331 347 Q438 378 450 515Z" fill="url(#coat)"/>
<path d="M178 355L250 423L322 355L304 334H196Z" fill="#132338"/>
<path d="M209 306V370Q250 395 291 370V306Z" fill="#C98B69"/>
<ellipse cx="250" cy="236" rx="105" ry="126" fill="#E7AC85"/>
<path d="M146 229Q130 130 209 106Q267 66 335 132Q364 177 346 232L337 203Q308 199 293 170Q251 197 205 184Q178 213 150 206Z" fill="#131929"/>
<path d="M163 167Q185 114 234 120Q274 93 319 143" fill="none" stroke="#273044" stroke-width="18" stroke-linecap="round"/>
<path d="M174 211Q197 197 219 209M283 209Q307 198 328 212" fill="none" stroke="#323040" stroke-width="8" stroke-linecap="round"/>
<ellipse class="eye" cx="202" cy="230" rx="8" ry="10" fill="#252638"/>
<ellipse class="eye" cx="297" cy="230" rx="8" ry="10" fill="#252638"/>
<path d="M247 237L237 280Q251 289 266 280" fill="none" stroke="#BD8067" stroke-width="6" stroke-linecap="round"/>
<path d="M218 308Q250 326 283 308" fill="none" stroke="#8E4E4E" stroke-width="7" stroke-linecap="round"/>
<path d="M148 239Q132 222 132 250Q132 283 156 278M350 239Q371 223 370 252Q367 282 346 278" fill="#D99B78"/>
<path d="M182 365L250 432L318 365" fill="none" stroke="#6CF0C2" stroke-width="9" opacity=".7"/>
</g>
<g stroke="#6CF0C2" fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M73 206l-19 22 19 22M427 206l19 22-19 22"/></g>
<circle class="mote" cx="94" cy="115" r="7" fill="#6CF0C2"/>
<circle class="mote" cx="420" cy="344" r="6" fill="#6CF0C2"/>
</g>
</svg>